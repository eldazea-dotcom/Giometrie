name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: giometrie-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Type-check frontend
        run: bun run typecheck

      - name: Run regression tests
        run: bun run test

      - name: Check deployment scripts
        run: |
          bash -n deploy/deploy.sh
          bash -n deploy/restart.sh
          node --test deploy/validate-config.test.mjs

      - name: Build frontend
        run: bun run build

      - name: Record release identity
        run: node deploy/write-release.mjs

      - name: Install backend deps
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: server
        run: bunx prisma generate

      - name: Type-check backend
        working-directory: server
        run: bun run build

      # DEPLOY_SSH_KEY holds the private key base64-encoded (not raw PEM) — pasting
      # a raw multi-line key into GitHub's secret box is prone to silent CRLF/whitespace
      # corruption on Windows, which breaks ssh-agent with a cryptic "error in libcrypto".
      # A single base64 line has no such failure mode.
      - name: Deploy and verify production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_SITE_URL: ${{ vars.DEPLOY_SITE_URL || 'https://www.giometrie.uz' }}
        run: bash deploy/deploy.sh
